name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The cache of .lake (with Mathlib) does not fit on the default runner disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: leanprover/lean-action@v1
      - name: Check axioms of the main results
        run: |
          lake env lean Axioms.lean | tee axioms.txt
          # Theorems 1 and 2, Corollaries 1 and 2, Lemmas 1 and 2 (eight declarations):
          # only the three standard axioms.
          test "$(grep -c "depends on axioms: \[propext, Classical.choice, Quot.sound\]" axioms.txt)" -eq 1
          ! grep -q sorryAx axioms.txt
